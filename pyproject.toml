[project]
name = "telecom-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asad", email = "asadsarfraz474@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.1.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
telecom-rag = "telecom_rag:main"
ingest-faq = "telecom_rag.ingest.ingest_faq:main"
ingest-tickets = "telecom_rag.ingest.ingest_tickets:main"
ingest-guides = "telecom_rag.ingest.ingest_pdf:main"
test-rag = "telecom_rag.rag_chain:main"
telecom-chat = "telecom_rag.cli:chat"
 
[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
